# تنظیمات PHP برای محیط تولید
; opcache بدون این، هر درخواست دوباره حدود هزار فایل PHP را کامپایل می‌کند.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.validate_timestamps=0
opcache.save_comments=1

; حافظه و زمان اجرا
memory_limit=512M
max_execution_time=120

; آپلود پیوست گفتگو (سقف اپلیکیشن ۲۰ مگابایت)
upload_max_filesize=24M
post_max_size=26M
max_file_uploads=10

; تاریخ و منطقه
date.timezone=Asia/Tehran
expose_php=Off

; تعداد worker های php-fpm.
; برای هر هسته‌ی CPU یک worker، با کمی فضای اضافه.
pm=dynamic
pm.max_children=16
pm.start_servers=4
pm.min_spare_servers=2
pm.max_spare_servers=8
pm.max_requests=500
