# php-fpm مستقیم؛ بدون upstream بلوک چون fastcgi_pass نیازی به آن ندارد.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # پیوست‌های گفتگو تا ۲۵ مگابایت (سقف اپلیکیشن ۲۰ مگابایت است)
    client_max_body_size 25m;

    # فشرده‌سازی؛ بدون این، باندل ۳۶۵ کیلوبایتی بدون فشرده‌سازی
    # به کاربر می‌رسد.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # هدرهای امنیتی — داخل هر location دوباره تکرار می‌شوند چون
    # nginx هدرهای سطح سرور را در بلاکی که add_header خودش را دارد
    # به ارث نمی‌برد.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # API از طریق php-fpm.
    # artisan serve تک‌نویسی بود و درخواست‌ها را پشت سر هم می‌چید؛
    # php-fpm چند worker دارد و با opcache هر درخواست را سرو می‌کند.
    location /api/ {
        include fastcgi_params;
        fastcgi_pass api:9000;

        # مسیر اسکریپت داخل کانتینر api
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;

        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $https if_not_empty;

        # آپلود ۲۰ مگابایتی و پاسخ‌های طولانی اکسل
        fastcgi_read_timeout 120s;
        fastcgi_send_timeout 120s;
        fastcgi_buffering off;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;

        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
