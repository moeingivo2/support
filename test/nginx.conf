# upstream باید بیرون از بلاک server تعریف شود.
# keepalive تا هر درخواستِ poll اتصال تازه به بک‌اند باز نکند.
upstream aio_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # پیوست‌های گفتگو تا ۲۵ مگابایت (سقف اپلیکیشن ۲۰ مگابایت است)
    client_max_body_size 25m;

    # فشرده‌سازی؛ بدون این، باندل ۳۶۵ کیلوبایتی بدون فشرده‌سازی
    # به کاربر می‌رسد.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # هدرهای امنیتی — داخل هر location دوباره تکرار می‌شوند چون
    # nginx هدرهای سطح سرور را در بلاکی که add_header خودش را دارد
    # به ارث نمی‌برد.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location /api/ {
        proxy_pass http://aio_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # آپلود ۲۰ مگابایتی و پاسخ‌های طولانی اکسل
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;

        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
