services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-api
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-support}
      DB_USERNAME: ${DB_USERNAME:-support}
      DB_PASSWORD: ${DB_PASSWORD:-support_secret}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    expose:
      - "9000"
    volumes:
      # پیوست‌های گفتگو و فایل‌های پنل روی دیسک public ذخیره می‌شوند و باید بین
      # بازسازی‌های کانتینر باقی بمانند.
      - storage-data:/var/www/storage/app/public
    depends_on:
      db:
        condition: service_healthy
    # php-fpm به‌جای artisan serve.
    # artisan serve تک‌نویسی بود: هر درخواست پشت سر قبلی صف می‌شد و با
    # opcache هم کامپایل دوباره‌ی فریم‌ورک را تکرار می‌کرد.
    command: >
      sh -c "php artisan storage:link --force &&
             php artisan migrate --force &&
             php-fpm --nodaemonize -F"

  web:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: support-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - api

  db:
    image: postgres:17-alpine
    container_name: support-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-support}
      POSTGRES_USER: ${DB_USERNAME:-support}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-support_secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-support} -d ${DB_DATABASE:-support}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  storage-data:
